<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VaultBridge — Moniepoint Platform</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0e14;
            color: #e0e6ed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: #141a24;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid #2a3440;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #2a3440;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #5b9bd5;
        }
        .logo span { color: #e0e6ed; }

        .status-badge {
            background: #1e3a2a;
            color: #7ddfb3;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 13px;
            border: 1px solid #2a6b3b;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 30px;
        }

        @media (max-width: 860px) {
            .grid-2col { grid-template-columns: 1fr; }
        }

        .card {
            background: #1c2431;
            border-radius: 18px;
            padding: 22px;
            border: 1px solid #2a3440;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #a0b3cc;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title i { color: #5b9bd5; }

        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #a0b3cc;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: #0f1620;
            border: 1px solid #2a3440;
            border-radius: 10px;
            color: #e0e6ed;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus, select:focus { border-color: #5b9bd5; }

        .btn {
            width: 100%;
            padding: 14px;
            background: #5b9bd5;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }
        .btn:hover { background: #4a8ac4; }
        .btn:disabled { background: #2a3a4a; cursor: not-allowed; }

        .btn-secondary {
            background: #2a3a4a;
        }
        .btn-secondary:hover { background: #1e2a3a; }

        .btn-secondary i { margin-right: 8px; }

        .log-entry {
            background: #0f1620;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            border-left: 4px solid #2a6b3b;
        }
        .log-entry.failed { border-left-color: #b33a4a; }
        .log-entry .amount { color: #7ddfb3; font-weight: 600; }
        .log-entry.failed .amount { color: #d97a8a; }
        .log-meta { color: #6a7f99; font-size: 12px; }

        .footer-note {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #2a3440;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #6a7f99;
        }
        .footer-note span { color: #5b9bd5; }

        #toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1e3a2a;
            color: #7ddfb3;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid #2a6b3b;
            display: none;
            font-size: 14px;
            z-index: 999;
        }

        .empty-state {
            color: #6a7f99;
            text-align: center;
            padding: 30px 0;
            font-size: 14px;
        }

        .balance-stats {
            margin-top: 18px;
            background: #0f1620;
            border-radius: 12px;
            padding: 16px;
        }

        .balance-stats .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .balance-stats .stat-row:last-child {
            margin-bottom: 0;
        }

        .balance-stats .stat-value {
            font-weight: 600;
        }

        .stat-value.green { color: #7ddfb3; }
        .stat-value.blue { color: #5b9bd5; }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div class="logo">Vault<span>Bridge</span> <i class="fas fa-shield-alt" style="font-size:18px; color:#5b9bd5; margin-left:8px;"></i></div>
        <div class="status-badge"><i class="fas fa-circle" style="font-size:10px; margin-right:6px; color:#7ddfb3;"></i> <span id="sessionStatus">Online — Moniepoint</span></div>
    </div>

    <!-- MAIN GRID -->
    <div class="grid-2col">

        <!-- LEFT: TRANSFER FORM -->
        <div class="card">
            <div class="card-title"><i class="fas fa-exchange-alt"></i> Initiate Transfer</div>

            <div class="form-group">
                <label>Target Bank</label>
                <select id="bankSelect">
                    <option value="gtbank">GTBank (GTCO)</option>
                    <option value="zenith">Zenith Bank</option>
                    <option value="access">Access Bank</option>
                    <option value="firstbank">First Bank</option>
                    <option value="uba">UBA</option>
                    <option value="moniepoint">Moniepoint</option>
                </select>
            </div>

            <div class="form-group">
                <label>Account Number</label>
                <input type="text" id="accountNumber" placeholder="Enter 10-digit account number" />
            </div>

            <div class="form-group">
                <label>Account Name (Resolved)</label>
                <input type="text" id="accountName" placeholder="Will auto-fill after validation" readonly />
            </div>

            <div class="form-group">
                <label>Amount (₦)</label>
                <input type="number" id="amount" placeholder="Enter amount" />
            </div>

            <button class="btn btn-secondary" id="validateBtn"><i class="fas fa-search"></i> Validate Account</button>
            <button class="btn" id="transferBtn"><i class="fas fa-rocket"></i> Transfer</button>
        </div>

        <!-- RIGHT: DASHBOARD + LOGS -->
        <div class="card">
            <div class="card-title"><i class="fas fa-list-ul"></i> Recent Transfers</div>
            <div id="logContainer">
                <div class="empty-state">No transfers yet</div>
            </div>
            <button class="btn btn-secondary" id="refreshLogsBtn"><i class="fas fa-sync-alt"></i> Refresh Logs</button>

            <div class="balance-stats">
                <div class="stat-row">
                    <span>Total transferred (today)</span>
                    <span class="stat-value green" id="totalTransferred">₦0</span>
                </div>
                <div class="stat-row">
                    <span>Moniepoint Balance</span>
                    <span class="stat-value blue" id="moniepointBalance">₦0</span>
                </div>
                <button class="btn btn-secondary" id="balanceBtn" style="margin-top:12px; padding:10px;"><i class="fas fa-wallet"></i> Refresh Balance</button>
            </div>
        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer-note">
        <span><i class="fas fa-lock" style="margin-right:6px;"></i> Powered by Moniepoint API</span>
        <span>v2.0 <i class="fas fa-circle" style="font-size:6px; margin:0 8px; color:#2a3440;"></i> <span style="color:#7ddfb3;" id="liveStatus">● Live</span></span>
    </div>

</div>

<!-- TOAST NOTIFICATION -->
<div id="toast"></div>

<script>
    // ============================================================
    // VAULTBRIDGE — FRONTEND LOGIC (Moniepoint Integration)
    // ============================================================

    // CONFIG — Replace with your actual backend API URL
    const API_BASE = 'https://your-api-server.com/api'; // ← CHANGE THIS

    // DOM Elements
    const bankSelect = document.getElementById('bankSelect');
    const accountNumber = document.getElementById('accountNumber');
    const accountName = document.getElementById('accountName');
    const amount = document.getElementById('amount');
    const validateBtn = document.getElementById('validateBtn');
    const transferBtn = document.getElementById('transferBtn');
    const logContainer = document.getElementById('logContainer');
    const refreshLogsBtn = document.getElementById('refreshLogsBtn');
    const totalTransferred = document.getElementById('totalTransferred');
    const moniepointBalance = document.getElementById('moniepointBalance');
    const balanceBtn = document.getElementById('balanceBtn');
    const toast = document.getElementById('toast');

    // ===== TOAST NOTIFICATION =====
    function showToast(msg, isError = false) {
        toast.textContent = msg;
        toast.style.background = isError ? '#3a1a2a' : '#1e3a2a';
        toast.style.color = isError ? '#d97a8a' : '#7ddfb3';
        toast.style.borderColor = isError ? '#6b2a3a' : '#2a6b3b';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    // ===== API CALL =====
    async function callAPI(endpoint, method = 'POST', data = {}) {
        const url = `${API_BASE}${endpoint}`;
        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: method === 'GET' ? undefined : JSON.stringify(data)
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
        } catch (err) {
            showToast('API error: ' + err.message, true);
            return null;
        }
    }

    // ===== VALIDATE ACCOUNT =====
    validateBtn.addEventListener('click', async function() {
        const bank = bankSelect.value;
        const account = accountNumber.value.trim();
        if (!account || account.length !== 10) {
            showToast('Enter a valid 10-digit account number', true);
            return;
        }
        validateBtn.disabled = true;
        validateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Validating...';
        const result = await callAPI('/validate', 'POST', { bank, account_number: account });
        validateBtn.disabled = false;
        validateBtn.innerHTML = '<i class="fas fa-search"></i> Validate Account';
        if (result && result.status === 'valid') {
            accountName.value = result.account_name || 'Unknown';
            showToast(`✅ Account validated: ${result.account_name}`);
        } else {
            showToast('❌ Validation failed: ' + (result?.error || 'Unknown error'), true);
        }
    });

    // ===== TRANSFER =====
    transferBtn.addEventListener('click', async function() {
        const bank = bankSelect.value;
        const account = accountNumber.value.trim();
        const amt = parseInt(amount.value);
        if (!account || account.length !== 10) {
            showToast('Enter a valid 10-digit account number', true);
            return;
        }
        if (isNaN(amt) || amt < 100) {
            showToast('Enter a valid amount (min ₦100)', true);
            return;
        }
        transferBtn.disabled = true;
        transferBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
        const result = await callAPI('/transfer', 'POST', {
            bank,
            account_number: account,
            amount: amt
        });
        transferBtn.disabled = false;
        transferBtn.innerHTML = '<i class="fas fa-rocket"></i> Transfer';
        if (result && result.status === 'success') {
            showToast(`✅ Transfer successful: ₦${amt.toLocaleString()} to ${account}`);
            refreshLogs();
            refreshBalance();
        } else {
            showToast('❌ Transfer failed: ' + (result?.error || 'Unknown error'), true);
        }
    });

    // ===== REFRESH LOGS =====
    async function refreshLogs() {
        const logs = await callAPI('/logs', 'GET');
        if (logs && Array.isArray(logs) && logs.length > 0) {
            logContainer.innerHTML = logs.map(log => `
                <div class="log-entry ${log.status === 'failed' ? 'failed' : ''}">
                    <div>
                        <strong>${log.bank}</strong> — ${log.account}<br />
                        <span class="log-meta">${log.account_name || 'Unknown'} • ${log.timestamp || 'Just now'}</span>
                    </div>
                    <div class="amount">₦${log.amount.toLocaleString()}</div>
                </div>
            `).join('');
            const total = logs.reduce((sum, l) => sum + (l.status === 'success' ? l.amount : 0), 0);
            totalTransferred.textContent = `₦${total.toLocaleString()}`;
        } else {
            logContainer.innerHTML = '<div class="empty-state">No transfers yet</div>';
            totalTransferred.textContent = '₦0';
        }
    }

    // ===== REFRESH BALANCE =====
    async function refreshBalance() {
        const result = await callAPI('/balance', 'GET');
        if (result && result.balance !== undefined) {
            moniepointBalance.textContent = `₦${result.balance.toLocaleString()}`;
        } else {
            moniepointBalance.textContent = '₦0';
        }
    }

    // ===== EVENT LISTENERS =====
    refreshLogsBtn.addEventListener('click', refreshLogs);
    balanceBtn.addEventListener('click', refreshBalance);

    // ===== INIT =====
    refreshLogs();
    refreshBalance();
    setInterval(refreshLogs, 30000);
    setInterval(refreshBalance, 60000);
    console.log('VaultBridge — Moniepoint Integration Ready');
</script>

</body>
</html>
